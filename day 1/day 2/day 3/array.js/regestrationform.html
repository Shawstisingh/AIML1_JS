<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #ffd6e7, #f8a8c8);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .form-box {
            background: white;
            width: 400px;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            color: #d63384;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: gray;
            margin-bottom: 25px;
        }

        label {
            font-weight: bold;
            color: #444;
            display: block;
            margin-top: 15px;
        }

        input[type="text"],
        input[type="tel"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
        }

        input:focus {
            border-color: #d63384;
            box-shadow: 0 0 5px #f3a6c8;
        }

        .gender {
            margin-top: 10px;
        }

        .gender label {
            display: inline;
            font-weight: normal;
            margin-right: 15px;
        }

        .gender input {
            accent-color: #d63384;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background: #d63384;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #b82b70;
        }

        .required {
            color: red;
        }
    </style>
</head>

<body>

    <div class="form-box">

        <h1>Create Account</h1>
        <p class="subtitle">Register to get started</p>

        <form>

            <label>
                Full Name <span class="required">*</span>
            </label>

            <input type="text"
                   placeholder="Enter your full name"
                   pattern="[A-Za-z ]+"
                   title="Name should contain letters only"
                   required>


            <label>
                Phone Number <span class="required">*</span>
            </label>

            <input type="tel"
                   placeholder="Enter 10 digit number"
                   pattern="[0-9]{10}"
                   maxlength="10"
                   title="Enter exactly 10 digits"
                   required>


            <label>
                Email <span class="required">*</span>
            </label>

            <input type="email"
                   placeholder="example@gmail.com"
                   required>


            <label>
                Gender <span class="required">*</span>
            </label>

            <div class="gender">

                <label>
                    <input type="radio"
                           name="gender"
                           required>
                    Male
                </label>

                <label>
                    <input type="radio"
                           name="gender">
                    Female
                </label>

                <label>
                    <input type="radio"
                           name="gender">
                    Other
                </label>

            </div>


            <label>
                Password <span class="required">*</span>
            </label>

            <input type="password"
                   placeholder="Minimum 6 characters"
                   minlength="6"
                   required>


            <button type="submit">
                Register
            </button>

        </form>

    </div>

</body>
</html>
